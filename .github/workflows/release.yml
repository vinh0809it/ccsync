name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Browser-mode binaries: pure Go, cross-compiled for every platform.
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          # Latest patched release; go.mod only states the minimum.
          go-version: stable
      - run: go test ./...
      - run: go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0
      - run: VERSION="${GITHUB_REF_NAME#v}" ./build/dist.sh
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/ccsync-*

  # Native-window apps: built on each OS (CGO + the OS web view).
  desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev
      - if: runner.os == 'Windows'
        run: go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0
      - shell: bash
        run: VERSION="${GITHUB_REF_NAME#v}" ./build/desktop.sh
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: dist/ccsync-*

  publish:
    needs: [binaries, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum ccsync-* > SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
